<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>License Lens · 依赖许可证分析</title><style>
:root{--bg:#f4f7fb;--ink:#15202b;--muted:#718096;--line:#dfe6ef;--blue:#3977f6;--green:#1b9c78;--amber:#c98b18;--red:#d95459}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.app{max-width:1280px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}.brand h1{margin:0;font-size:21px}.brand small{color:var(--muted)}.actions{display:flex;gap:8px}button{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--blue);color:var(--blue)}.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}.summary{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:17px}.metric small{display:block;color:var(--muted);margin-bottom:7px}.metric b{font-size:25px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:17px}.panel h3{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:0 0 13px}.textarea{width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:11px;line-height:1.6;font:12px ui-monospace,monospace}.drop{border:1px dashed #aab9cb;border-radius:9px;padding:15px;text-align:center;color:var(--muted);margin-top:10px}.drop input{display:none}.drop label{color:var(--blue);cursor:pointer}.hint{color:var(--muted);font-size:12px;line-height:1.6}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.filters button{font-size:12px;padding:6px 9px}.filters button.active{background:var(--ink);color:#fff}.row{display:grid;grid-template-columns:1.3fr .8fr .9fr 1fr 70px;align-items:center;gap:12px;border-top:1px solid var(--line);padding:14px 4px}.row.head{border-top:0;padding-top:0;color:var(--muted);font-size:12px}.pkg{display:flex;align-items:center;gap:9px}.pkgicon{width:28px;height:28px;border-radius:7px;background:#e8efff;color:var(--blue);display:grid;place-items:center;font-weight:700}.version{color:var(--muted);font-size:12px}.license{font-family:ui-monospace,monospace;font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px}.ok{background:#e3f7ef;color:#147455}.review{background:#fff3d8;color:#996a0d}.risk{background:#ffe3e5;color:#a93942}.inspect{color:var(--blue);font-size:12px;cursor:pointer}.notice{background:#fff9e9;border:1px solid #f0d89d;border-radius:9px;padding:12px;color:#835d12;margin-top:15px;font-size:12px;line-height:1.6}.details{margin-top:15px;background:#f7f9fc;border-radius:9px;padding:13px;display:none}.details h4{margin:0 0 7px}.details p{margin:5px 0;color:var(--muted);line-height:1.5}.manual{display:flex;gap:8px;margin-top:12px}.manual input,.manual select{border:1px solid var(--line);border-radius:7px;padding:8px;min-width:0}.status{color:var(--green);font-size:12px;min-height:18px;margin-top:8px}@media(max-width:850px){.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:1.2fr .7fr .8fr 1fr 50px}}@media(max-width:600px){.app{padding:13px}.top{align-items:flex-start;gap:10px;flex-direction:column}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 70px 70px}.row>:nth-child(3),.row>:nth-child(4){display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">L</div><div><h1>License Lens</h1><small>依赖许可证兼容性分析</small></div></div><div class="actions"><button id="reset">重置示例</button><button id="export" class="primary">导出 Markdown</button></div></header><section class="summary"><div class="metric"><small>已分析依赖</small><b id="total">8</b></div><div class="metric"><small>兼容通过</small><b class="good" id="pass">5</b></div><div class="metric"><small>需要复核</small><b class="warn" id="review">2</b></div><div class="metric"><small>高风险冲突</small><b class="bad" id="risk">1</b></div></section><section class="grid"><aside class="panel"><h3>导入依赖清单</h3><textarea id="input" class="textarea" spellcheck="false"></textarea><button id="analyze" class="primary" style="width:100%;margin-top:10px">开始分析</button><div class="drop">拖放 package.json 或许可证清单<br><label for="file">选择文件<input id="file" type="file" accept=".txt,.json,.csv,.lock"></label></div><p class="hint">支持每行一个依赖，格式：<code>名称@版本 许可证</code>。未识别许可证会标记为需复核。</p><div class="manual"><input id="manualName" placeholder="依赖名"><select id="manualLicense"><option>MIT</option><option>Apache-2.0</option><option>GPL-3.0</option><option>BSD-3-Clause</option><option>Proprietary</option></select><button id="add">添加</button></div><div class="status" id="status"></div></aside><section class="panel"><h3>分析结果</h3><div class="filters"><button class="active" data-filter="all">全部 <span id="fAll">8</span></button><button data-filter="ok">兼容通过</button><button data-filter="review">需复核</button><button data-filter="risk">高风险</button><input id="search" placeholder="搜索依赖…" style="margin-left:auto;border:1px solid var(--line);border-radius:7px;padding:7px;max-width:140px"></div><div class="row head"><div>依赖</div><div>版本</div><div>许可证</div><div>结论</div><div></div></div><div id="results"></div><div class="notice"><b>兼容性提示</b><br>GPL-3.0 组件要求衍生作品以 GPL 方式发布；专有许可证通常不能与开源分发直接兼容。请在发布前让法务复核结论。</div><div class="details" id="details"></div></section></section></main><script>
const seed=['react@18.3.1 MIT','lodash@4.17.21 MIT','sharp@0.33.4 Apache-2.0','some-proprietary@1.0.0 Proprietary','legacy-gpl@2.4.0 GPL-3.0','axios@1.7.2 MIT','zod@3.23.8 MIT','font-awesome@6.5.2 CC-BY-4.0'].join('\n');let rows=[],filter='all';const known={MIT:'ok',Apache:'ok','Apache-2.0':'ok','BSD-3-Clause':'ok','CC-BY-4.0':'review','GPL-3.0':'risk',Proprietary:'review'};document.querySelector('#input').value=seed;function parse(){rows=document.querySelector('#input').value.split(/\n|,/).map(s=>s.trim()).filter(Boolean).map((s,i)=>{let m=s.match(/^(.+?)@([\w.-]+)\s+(.+)$/);let name=m?m[1]:s,version=m?m[2]:'—',lic=m?m[3]:'Unknown';let state=known[lic]||'review';return{id:i,name,version,lic,state,reason:state==='ok'?'许可证允许在保留声明后分发':state==='risk'?'Copyleft 条款可能与本项目分发方式冲突':'需要确认许可证文本与使用方式'}});render()}function render(){let q=document.querySelector('#search').value.toLowerCase(),out=document.querySelector('#results');out.innerHTML='';rows.filter(r=>(filter==='all'||r.state===filter)&&r.name.toLowerCase().includes(q)).forEach(r=>{let d=document.createElement('div');d.className='row';d.innerHTML=`<div class="pkg"><div class="pkgicon">◈</div><div><b>${r.name}</b><br><span class="version">package dependency</span></div></div><div class="version">${r.version}</div><div class="license">${r.lic}</div><div><span class="badge ${r.state}">${r.state==='ok'?'兼容通过':r.state==='risk'?'高风险':'需复核'}</span></div><div class="inspect" data-id="${r.id}">查看依据</div>`;out.append(d)});document.querySelector('#total').textContent=rows.length;document.querySelector('#pass').textContent=rows.filter(r=>r.state==='ok').length;document.querySelector('#review').textContent=rows.filter(r=>r.state==='review').length;document.querySelector('#risk').textContent=rows.filter(r=>r.state==='risk').length;document.querySelector('#fAll').textContent=rows.length}document.querySelector('#analyze').onclick=()=>{parse();document.querySelector('#status').textContent='分析完成 · 已检查 '+rows.length+' 条依赖'};document.querySelector('#search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.querySelector('#results').onclick=e=>{let id=e.target.dataset.id;if(id===undefined)return;let r=rows.find(x=>x.id==id),d=document.querySelector('#details');d.style.display='block';d.innerHTML=`<h4>${r.name} · ${r.lic}</h4><p>${r.reason}</p><p>分析依据：识别到 SPDX 标识 <code>${r.lic}</code>，结合常见分发条款给出初步结论。</p>`};document.querySelector('#add').onclick=()=>{let n=document.querySelector('#manualName').value.trim();if(n){document.querySelector('#input').value+=`\n${n}@1.0.0 ${document.querySelector('#manualLicense').value}`;parse();document.querySelector('#manualName').value=''}};document.querySelector('#file').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>{document.querySelector('#input').value=r.result;parse()};r.readAsText(f)}};document.querySelector('#reset').onclick=()=>{document.querySelector('#input').value=seed;parse()};document.querySelector('#export').onclick=()=>{let md='# License Lens 分析报告\n\n| 依赖 | 版本 | 许可证 | 结论 |\n|---|---|---|---|\n'+rows.map(r=>`| ${r.name} | ${r.version} | ${r.lic} | ${r.state} |`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='license-report.md';a.click();document.querySelector('#status').textContent='Markdown 报告已导出'};parse();
</script></body></html>
